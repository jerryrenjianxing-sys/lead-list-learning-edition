name: Windows checks and preview release
on:
  push:
    branches: [main, 'modernization/**']
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - run: uv sync --locked --python 3.11.16
      - run: .venv/Scripts/python.exe -m playwright install chromium
      - run: .venv/Scripts/python.exe -m pytest tests -q
      - run: npm.cmd --prefix webui ci --no-audit --no-fund
      - run: npm.cmd --prefix webui run build
      - run: npm.cmd --prefix electron ci --no-audit --no-fund
      - run: npm.cmd --prefix electron run test
      - run: node electron/node_modules/playwright/cli.js install chromium
      - run: node electron/tests/workspace-view.cjs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - name: Build the tagged version
        run: ./packaging/build-windows-release.ps1 -Tag $env:RELEASE_TAG
      - name: Verify installer migration and private next-version update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $release = Join-Path $PWD "release/$version"
          $legacy = Join-Path $PWD '.cache/baseline041'
          New-Item -ItemType Directory -Path $legacy -Force | Out-Null
          gh release download v0.4.1 --repo jerryrenjianxing-sys/lead-list-learning-edition --pattern 'MediaWorkbench.Desktop-win-preview-Setup.exe' --dir $legacy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $oldSetup = Join-Path $legacy 'MediaWorkbench.Desktop-win-preview-Setup.exe'
          if ((Get-FileHash -LiteralPath $oldSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f7070135ffacfaa8c449f1b23ecceb8d15f4a9a0b6bdcbc921702ea05003497c') { throw 'Baseline installer fixture checksum mismatch' }
          .venv/Scripts/python.exe packaging/prepare_test_release.py --source build/MediaWorkbench --output .cache/private-upgrade
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $private = Get-Content '.cache/private-upgrade/PRIVATE_TEST_RESULT.json' -Raw | ConvertFrom-Json
          $feed = Get-Content (Join-Path $release 'releases.win-preview.json') -Raw | ConvertFrom-Json
          $full = @($feed.Assets | Where-Object { $_.Version -eq $version -and $_.Type -eq 'Full' -and $_.PackageId -eq 'MediaWorkbench.Desktop' })
          $setups = @(Get-ChildItem -LiteralPath $release -Filter '*Setup.exe')
          if ($full.Count -ne 1 -or $setups.Count -ne 1) { throw 'Current installer or update package is ambiguous' }
          .venv/Scripts/python.exe tests/electron_upgrade_smoke.py --baseline-version 0.4.1 --old-setup $oldSetup --new-setup ($setups[0].FullName) --new-package (Join-Path $release ($full[0].FileName)) --version $version --next-package $private.package --next-version $private.version --output .cache/upgrade-smoke-raw.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe packaging/collect_delivery.py --version $version --upgrade-result .cache/upgrade-smoke-raw.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the actual native desktop updater
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $app = Join-Path $PWD 'build/MediaWorkbench'
          $release = Join-Path $PWD "release/$version"
          $nativeResult = Join-Path $PWD '.cache/native-update-smoke-raw.json'
          $private = Get-Content '.cache/private-upgrade/PRIVATE_TEST_RESULT.json' -Raw | ConvertFrom-Json
          $setups = @(Get-ChildItem -LiteralPath $release -Filter '*Setup.exe')
          if ($setups.Count -ne 1) { throw 'Current installer is ambiguous' }
          npm.cmd --prefix electron run update-smoke -- --directory $app --setup ($setups[0].FullName) --next-package $private.package --output $nativeResult
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe packaging/collect_delivery.py --version $version --native-update-result $nativeResult
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify bundled runtimes and isolated self-test
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $app = Join-Path $PWD 'build/MediaWorkbench'
          $desktopResult = Join-Path $PWD "release/$version/ELECTRON_TEST_RESULT.json"
          npm.cmd --prefix electron run smoke -- --directory $app --output $desktopResult
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/tests/skill-file.cjs --directory $app --output (Join-Path $PWD "release/$version/SKILL_FILE_RESULT.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe tests/electron_desktop_smoke.py --directory $app --output "release/$version/ELECTRON_LIFECYCLE_RESULT.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe packaging/verify_selftest.py --directory build/MediaWorkbench --output "release/$version/SELF_TEST_RESULT.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe packaging/collect_delivery.py --version $version
      - name: Verify source remained clean
        run: |
          if (git status --porcelain) { throw 'Build modified the source checkout' }
      - name: Preserve verified release files for publication recovery
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-windows-preview-${{ github.ref_name }}-${{ github.run_attempt }}
          path: release/*/**
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Upload, verify and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/Scripts/python.exe packaging/publish_github.py --tag $env:RELEASE_TAG
      - name: Preserve diagnostic evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostics
          path: |
            release/*/SELF_TEST_RESULT.json
            release/*/ELECTRON_TEST_RESULT.json
            release/*/ELECTRON_LIFECYCLE_RESULT.json
            release/*/ELECTRON_UPGRADE_RESULT.json
            release/*/ELECTRON_NATIVE_UPDATE_RESULT.json
            release/*/SKILL_FILE_RESULT.json
            release/*/build-integrity.json
            .cache/native-update-smoke-raw.json
            electron/.cache/native-update-smoke-raw.json
          if-no-files-found: ignore
