name: Windows checks and preview release
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - run: uv sync --locked --python 3.11.16
      - run: .venv/Scripts/python.exe -m playwright install chromium
      - run: .venv/Scripts/python.exe -m pytest tests -q
      - run: npm.cmd --prefix webui ci --no-audit --no-fund
      - run: npm.cmd --prefix webui run build
      - run: ./packaging/build-launcher.ps1
      - run: ./packaging/test-updates.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - name: Build the tagged version
        run: ./packaging/build-windows-release.ps1 -Tag $env:RELEASE_TAG
      - name: Verify bundled runtimes and isolated self-test
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          .venv/Scripts/python.exe packaging/verify_selftest.py --directory build/MediaWorkbench --output "release/$version/SELF_TEST_RESULT.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe packaging/collect_delivery.py --version $version
      - name: Verify source remained clean
        run: |
          if (git status --porcelain) { throw 'Build modified the source checkout' }
      - name: Upload, verify and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/Scripts/python.exe packaging/publish_github.py --tag $env:RELEASE_TAG
      - name: Preserve diagnostic evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostics
          path: |
            release/*/SELF_TEST_RESULT.json
            release/*/build-integrity.json
          if-no-files-found: ignore
