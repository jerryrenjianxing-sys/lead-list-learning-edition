[project]
name = "mediaworkbench"
author = "程序员阿江-Relakkes <relakkes@gmail.com>"
version = "0.1.1"
description = "A social media crawler project, support Xiaohongshu, Weibo, Zhihu, Bilibili, Douyin, BaiduTieBa etc."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1,<26",
    "aiomysql==0.2.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.16.5",
    "asyncmy>=0.2.10",
    "cryptography>=45.0.7",
    "fastapi>=0.115,<1",
    "httpx==0.28.1",
    "jieba==0.42.1",
    "matplotlib>=3.11.0",
    "motor>=3.3.0",
    "opencv-python>=4.11.0.86",
    "pandas==2.2.3",
    "parsel==1.9.1",
    "pillow>=12.2.0",
    "playwright>=1.61.0",
    "psutil>=7.0.0,<8",
    "pydantic>=2.13.4",
    "pyexecjs==1.5.1",
    "pyhumps>=3.8.0",
    "python-dotenv==1.0.1",
    "redis~=4.6.0",
    "requests>=2.32.5,<3",
    "sqlalchemy>=2.0.43",
    "tenacity>=9,<10",
    "typer>=0.12.3",
    "uvicorn>=0.30,<1",
    "wordcloud>=1.9.6",
    "openpyxl>=3.1.2",
    "websockets>=15.0.1",
    "asyncpg>=0.31.0",
    "xhshow>=0.2.0",
    "python-docx>=1.2,<2",
    "jsonschema>=4.25,<5",
    "python-multipart>=0.0.20",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pyyaml>=6,<7",
]
